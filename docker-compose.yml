services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
    image: production-planner:local
    init: true
    working_dir: /app
    ports:
      - "8096:8096"
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:-postgresql://planner:planner@postgres:5432/planner}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    volumes:
      - ./planner:/app/planner
    command: ["python", "-m", "planner.web"]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    image: production-planner:local
    init: true
    restart: unless-stopped
    stop_grace_period: 150s
    working_dir: /app
    environment:
      PYTHONUNBUFFERED: "1"
      DEPARTMENT_PROCESSES: ${DEPARTMENT_PROCESSES:-4}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:-postgresql://planner:planner@postgres:5432/planner}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./planner:/app/planner
    command: ["python", "-m", "planner.worker"]

  planner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
    image: production-planner:local
    init: true
    working_dir: /app
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./planner:/app/planner
    command: ["python", "-m", "planner.main"]

  tests:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
    image: production-planner:local
    profiles: ["test"]
    working_dir: /app
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql://planner:planner@postgres:5432/planner_test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./planner:/app/planner
      - ./tests:/app/tests
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]

volumes:
  postgres-data:
  redis-data:
